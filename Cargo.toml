[workspace]
members = ["crates/svm-builds", "crates/svm-rs"]
resolver = "2"

[workspace.package]
version = "0.5.30"
edition = "2024"
rust-version = "1.89"
authors = [
    "Rohit Narurkar <rohit.narurkar@protonmail.com>",
    "Matthias Seitz <matthias.seitz@outlook.de>",
    "DaniPopes <57450786+DaniPopes@users.noreply.github.com>",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alloy-rs/svm-rs"
homepage = "https://github.com/alloy-rs/svm-rs"

[workspace.lints.clippy]
dbg_macro = "warn"
manual_string_new = "warn"
uninlined_format_args = "warn"
use_self = "warn"
redundant_clone = "warn"
missing_const_for_fn = "warn"
needless_return = "allow"

[workspace.lints.rust]
# missing_copy_implementations = "warn"
# missing_debug_implementations = "warn"
# missing_docs = "warn"
rust_2018_idioms = "warn"
# unreachable_pub = "warn"
unused_must_use = "warn"
redundant_lifetimes = "warn"
unnameable_types = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.dependencies]
svm = { package = "svm-rs", version = "0.5.30", path = "crates/svm-rs", default-features = false }

const-hex = "1.10"
semver = "1"
serde = "1"
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["socks"] }

[profile.release]
lto = "fat"
debug = 0
strip = "debuginfo"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
